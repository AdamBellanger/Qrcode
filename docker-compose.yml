services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3003:3000"
    environment:
      HOST: ${HOST:?HOST is required (e.g. https://qr.yourdomain.com)}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - services_default

networks:
  services_default:
    external: true